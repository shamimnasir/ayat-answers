<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Crimson+Pro:wght@400;600&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1024px; height:500px; overflow:hidden; }
  .wrap {
    width:1024px; height:500px; position:relative;
    background:
      radial-gradient(120% 140% at 18% 12%, #23523a 0%, #1a3a2a 42%, #0c1a0f 100%);
    display:flex; align-items:center; overflow:hidden;
  }
  /* subtle geometric lattice, drawn not generated */
  .lattice { position:absolute; inset:0; opacity:.10;
    background-image:
      repeating-linear-gradient(45deg,  #d4a434 0 1.5px, transparent 1.5px 46px),
      repeating-linear-gradient(-45deg, #d4a434 0 1.5px, transparent 1.5px 46px);
    mask-image: radial-gradient(70% 100% at 100% 50%, #000 0%, transparent 72%);
    -webkit-mask-image: radial-gradient(70% 100% at 100% 50%, #000 0%, transparent 72%);
  }
  .rule { position:absolute; top:34px; bottom:34px; left:34px; right:34px;
          border:1px solid rgba(212,164,52,.34); border-radius:4px; }
  .rule::before, .rule::after {
    content:""; position:absolute; width:54px; height:54px;
    border:2px solid rgba(212,164,52,.55);
  }
  .rule::before { top:-1px; left:-1px; border-right:0; border-bottom:0; border-radius:4px 0 0 0; }
  .rule::after  { bottom:-1px; right:-1px; border-left:0; border-top:0; border-radius:0 0 4px 0; }

  .content { position:relative; padding-left:96px; max-width:660px; }
  .arabic {
    font-family:'Noto Naskh Arabic','Amiri',serif; direction:rtl;
    font-size:62px; font-weight:700; color:#e8c56a; line-height:1.5;
    letter-spacing:.5px; text-shadow:0 2px 18px rgba(0,0,0,.45);
  }
  .title {
    font-family:'Crimson Pro',serif; font-size:78px; font-weight:600;
    color:#f6efdd; letter-spacing:1.5px; margin-top:6px; line-height:1;
  }
  .divider { display:flex; align-items:center; gap:14px; margin:22px 0 20px; }
  .divider .line { height:1px; width:96px; background:linear-gradient(90deg,#d4a434,transparent); }
  .divider .dot  { width:7px; height:7px; transform:rotate(45deg); background:#d4a434; }
  .tag {
    font-family:'Crimson Pro',serif; font-size:29px; color:#cfd8cf;
    letter-spacing:.3px; line-height:1.45;
  }
  .tag b { color:#e8c56a; font-weight:600; }
</style></head>
<body><div class="wrap">
  <div class="lattice"></div>
  <div class="rule"></div>
  <div class="content">
    <div class="arabic">القرآن الكريم</div>
    <div class="title">Al Quran</div>
    <div class="divider"><span class="line"></span><span class="dot"></span></div>
    <div class="tag">Arabic, English &amp; Bangla &middot; <b>works offline</b><br>Pronunciation guide &amp; AI search</div>
  </div>
</div></body></html>
